name: Bug report
description: Report a reproducible problem in Lazberry PLY.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Lazberry PLY.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Drop ...
        3. See ...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Chrome 140 on Windows 11
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: Test file details
      description: Describe the file format, size, and properties. Attach a non-sensitive sample when possible.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, console errors, or any other useful details.
